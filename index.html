<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home</title>
	<style>
		:root{
			--box-shadow-small: 0 0 5px rgba(0, 0, 0, 0.3);
			--box-shadow-middle: 0 0 10px rgba(0, 0, 0, 0.5);
			--box-shadow-large: 0 0 15px rgba(0, 0, 0, 0.7);
			--color-hover: #f0f0ff;
		}
		*{
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			line-height: 1;
			border: none;
		}
		button{
			box-shadow: var(--box-shadow-small);
			cursor: pointer;
		}
		.icon{
			width: 22px;
		}
	</style>
	<script type="module" src="./index.js"></script>
	<link rel="stylesheet" href="./style.css">
</head>
<body><app-main id="appmain">
<navigation-bar slot="navigation">
	<span slot="logo">VG</span>
	<navigation-page slot="navigation-page">
		<span slot="logo">VG</span>
		<a route="/">Home</a>
		<a route="/about">About</a>
		<a route="/blog">Blog</a>
	</navigation-page>
</navigation-bar>
<main slot="main">
	<page-home route="/"></page-home>
	<page-about route="/about">
		<about-card slot="item"></about-card>
	</page-about>
	<page-blog route="/blog">
		<blog-navigation slot="navigation">
			<a route="/blog/home">
				<img class="icon" src="resource/icon/house-solid-full.svg">
				<span class="text">首页</span>
			</a>
			<a route="/blog/about">
				<img class="icon" src="resource/icon/user-solid-full.svg">
				<span class="text">关于</span>
			</a>
		</blog-navigation>
		<section slot="content">
			<blog-home route="/blog/home">
				<article-card slot="item"></article-card>
				<default-pagination slot="pagination"></default-pagination>
			</blog-home>
			<blog-about route="/blog/about">
				<about-card slot="item"></about-card>
			</blog-about>
		</section>
	</page-blog>
	<page-article route="/article"></page-article>
</main>
<footer slot="footer"></footer>
</app-main></body>
</html>
