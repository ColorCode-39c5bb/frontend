<script>
HTMLElement.prototype.initShadowStyle = function(){
	if(this.shadowRoot == null) return;
	const defaultStyleSheet = new CSSStyleSheet();
	defaultStyleSheet.insertRule(`
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
	`);
	this.shadowRoot.adoptedStyleSheets.push(defaultStyleSheet);
}
function NotSlotted(){
	const instance = Reflect.construct(HTMLElement, [], NotSlotted);
	instance.appendChild(document.importNode(document.getElementById("not-slotted").content, true));
	return instance;
}
Object.setPrototypeOf(NotSlotted.prototype, HTMLElement.prototype);
customElements.define("not-slotted", NotSlotted);
</script>
