<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home</title>
	<style>
		:root{
			--box-shadow-small: 0 0 5px rgba(204, 133, 255, 0.3);
			--box-shadow-middle: 0 0 10px rgba(204, 133, 255, 0.5);
			--box-shadow-large: 0 0 15px rgba(204, 133, 255, 0.7);
		}
		*{
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			line-height: 1;
			border: none;
		}
		button{
			box-shadow: var(--box-shadow-small);
			cursor: pointer;
		}
	</style>
	<script type="module" src="./index.js"></script>
</head>
<body><app-main>
<navigation-bar slot="navigation">
	<span slot="logo">VG</span>
	<navigation-page slot="navigation-page">
		<span slot="logo">VG</span>
		<a route="/">Home</a>
		<a route="/about">About</a>
		<a route="/blog">Blog</a>
	</navigation-page>
</navigation-bar>
<main slot="main">
	<page-home route="/blog"></page-home>
	<page-about route="/about"></page-about>
	<page-blog route="/">
		<blog-navigation slot="blog-navigation" js-data>
			<img slot="profile" src="http://localhost:5500/resource/Reflect_construct.png">
			<p slot="nick" js-data="nick" js-text></p>
			<text-typing slot="signature" js-data="signatures" typeinterval="500"></text-typing>
			<a route="/blog/home">首页</a>
			<a route="/blog/about">关于</a>
		</blog-navigation>
		<section js-data="about">
			<blog-home route="/blog/home">
				<article-card slot="blog-item"></article-card>
			</blog-home>
			<blog-about route="/blog/about" js-data></blog-about>
		</section>
	</page-blog>
</main>
<footer slot="footer"></footer>
</app-main></body>
</html>
