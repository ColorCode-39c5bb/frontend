<template id="background-image">
<img src="">
<slot name="load-animation">
	<image-load-animation type="spinner"></image-load-animation>
</slot>
<style>
	img, image-load-animation{
		position: fixed;
		top: 0px;
		left: 50%;
		transform: translate(-50%, 0);
		z-index: -1;
		transition: top 0.3s ease-out;
	}
</style>
</template>


<template id="navigation-bar">
<a href="#" style="text-align: left;">
	<slot name="logo"><not-slotted>未插入LOGO</not-slotted></slot>
</a>
<span id="current-page-bar" style="text-align: center;">Home</span>
<button id="page-button" style="text-align: right;">OO</button>
<div id="navigation-page" style="display: none; flex-grow: 0;">
	<div id="filter"></div>
	<slot name="navigation-page"></slot>
</div>
<style>
	:host{
		width: 100%;
		display: flex;
		align-items: center;
		background: transparent;
		box-shadow: var(--box-shadow-middle);
		position: fixed;
		top: -66px;
		left: 0px;
		transition: top 0.3s ease-out;
		z-index: 1;
	}
	:host > *{
		flex-basis: 0;
		flex-grow: 1;
	}
	::slotted(navigation-page){
		width: 80vw; height: 90vh;
		position: fixed;
		top: 5vh;
		left: 10vw;
		border-radius: 10px;
	}
	#filter{
		width: 100vw; height: 100vh;
		position: fixed;
		top: 0px; left: 0px;
		background-color: rgba(0, 0, 0, 0.5);
		z-index: -1;
	}
</style>
</template>


<template id="article-card">
<div id="title" style="height: 100px;">标题</div>
<div id="preview" style="height: 100px;">预览</div>
<div id="tags">标签</div>
<img id="cover" src="http://localhost:5500/resource/Reflect_construct.png">
<style>
:host{
	display: block;
	width: 100%; height: 100%;
	padding: 20px;
	box-shadow: var(--box-shadow-large);
	text-align: center;
	overflow: hidden;
	position: relative;
	cursor: pointer;
	border-radius: 20px;
	opacity: 0.8;
}
#cover{
	width: 100%;
	position: absolute;
	top: 0; left: 0;
	transition: all 0.2s ease-out;
	z-index: -1;
}
</style>
</template>


<template id="not-slotted">
	<slot>未插入内容</slot>
<style>
:host{
	width: 100%; height: 100%;
	text-align: center;
	color: #666;
}
</style>
</template>

<template id="app-main">
	<slot name="navigation"><not-slotted>未插入导航栏</not-slotted></slot>
	<slot name="main">
		<slot></slot>
	</slot>
	<slot name="footer"><not-slotted>未插入页脚</not-slotted></slot>	
</template>

<template id="text-typing">
<span id="input"></span>
<span id="cursor"></span>
<style>
#cursor{
	display: inline-block;
	width: 5px;
}
</style>
</template>
