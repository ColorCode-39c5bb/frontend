<template id="background-image">
<img src="">
<slot name="load-animation">
	<image-load-animation type="spinner"></image-load-animation>
</slot>
<style>
	img{
		position: fixed;
		top: 0px;
		left: 50%;
		transform: translate(-50%, 0);
		z-index: -1;
		transition: top 0.3s ease-out;
	}
</style>
</template>


<template id="navigation-bar">
<div id="container" style="z-index: 2;">
	<a href="#"><slot name="logo">
		<not-slotted>未插入LOGO</not-slotted>
	</slot></a>
	<span id="current-page-bar">Home</span>
	<button id="switch-button">OO</button>
</div>
<div id="navigation-page" style="display: none;">
	<div id="filter" style="z-index: -1;"></div>
	<slot name="navigation-page">
		<not-slotted>未插入导航页</not-slotted>
	</slot>
</div>
<style>
	#container{
		width: 100%;
		min-height: 60px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		background: transparent;
		box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
		position: absolute;
		top: -66px;
		left: 0px;
		transition: top 0.3s ease-out;
	}
	#container:hover{
		top: 0px;
	}
	#container > *{
		min-width: 50px;
		text-align: center;
	}
	button{
		padding: 8px 16px;
		border-radius: 20px;
		box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
		background-color: antiquewhite;
	}
	#navigation-page{
		width: 80vw; height: 90vh;
		position: fixed;
		top: 5vh;
		left: 10vw;
		border-radius: 10px;
		overflow: hidden;
	}
	#filter{
		width: 100vw; height: 100vh;
		position: fixed;
		top: 0px; left: 0px;
		background-color: rgba(0, 0, 0, 0.5);
	}
</style>
</template>


<template id="navigation-page">
<div id="container">
<div id="layout">
	<p><slot name="logo">
		<not-slotted>未插入LOGO</not-slotted>
	</slot></p>
	<slot>
		<not-slotted>未插入导航项</not-slotted>
	</slot>
</div>
</div>
<style>
	#container{
		width: 100%; height: 100%;
		align-items: center;
		background-color: antiquewhite;
		box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
	}
	#layout{
		width: 100%;
		text-align: center;
		position: absolute;
		padding: 0px 20px;
		top: 50%;
		transform: translate(0, -50%);
		font-size: larger;
	}
	#layout ::slotted(a){
		display: block;
		padding: 12px 24px !important;
		color: #333;
		text-decoration: none;
		transition: all 0.3s ease-in-out;
	}
	#layout ::slotted(a:hover){
		background-color: #f0f0f0;
		box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
		background-color: #fff;
		border-radius: 20px;
	}
</style>
</template>

<template id="article-card">
<div id="container">
	<div id="title"></div>
	<div id="preview"></div>
	<div id="tags"></div>
</div>
</template>

<template id="article-page">
<div id="container">
	<div id="title"></div>
	<div id="content"></div>
	<div id="tags"></div>
</div>
</template>
