<template id="background-image">
<img src="">
<slot name="load-animation">
	<image-load-animation type="spinner"></image-load-animation>
</slot>
<style>
	img, image-load-animation{
		position: fixed;
		top: 0px;
		left: 50%;
		transform: translate(-50%, 0);
		z-index: -1;
		transition: top 0.3s ease-out;
	}
</style>
</template>


<template id="navigation-bar">
<a href="#" style="text-align: left;">
	<slot name="logo"><not-slotted>未插入LOGO</not-slotted></slot>
</a>
<span id="current-page-bar" style="text-align: center;">Home</span>
<button id="page-button" style="text-align: right;">OO</button>
<slot name="navigation-page"></slot>
<style>
	:host{
		width: 100%;
		display: flex;
		align-items: center;
		background: transparent;
		box-shadow: var(--box-shadow-middle);
		position: fixed;
		top: -66px;
		left: 0px;
		transition: top 0.3s ease-out;
		z-index: 1;
	}
	:host > *{
		flex-basis: 0;
		flex-grow: 1;
	}
	::slotted(navigation-page:not(:popover-open)) {
		display: none;
	}
	::slotted(navigation-page){
		width: 80vw; height: 90vh;
		position: fixed;
		top: 5vh;
		left: 10vw;
		border-radius: 10px;
	}
	::slotted(navigation-page)::backdrop{
		background-color: rgba(0, 0, 0, 50%);
	}
</style>
</template>


<template id="article-card">
<div id="title" style="height: 100px;">标题</div>
<div id="preview" style="height: 100px;">预览</div>
<div id="tags">
	<div class="tag"></div>
</div>
<img id="cover" src="http://localhost:5500/resource/Reflect_construct.png">
<style>
:host{
	display: block;
	width: 100%; height: 100%;
	padding: 20px;
	box-shadow: var(--box-shadow-large);
	text-align: center;
	overflow: hidden;
	position: relative;
	cursor: pointer;
	border-radius: 20px;
	opacity: 0.8;
}
#cover{
	width: 100%;
	position: absolute;
	top: 0; left: 0;
	transition: all 0.2s ease-out;
	z-index: -1;
}
</style>
</template>


<template id="not-slotted">
	<slot>未插入内容</slot>
<style>
:host{
	width: 100%; height: 100%;
	text-align: center;
	color: #666;
}
</style>
</template>

<template id="app-main">
	<slot name="navigation"><not-slotted>未插入导航栏</not-slotted></slot>
	<slot name="main">
		<slot></slot>
	</slot>
	<slot name="footer"><not-slotted>未插入页脚</not-slotted></slot>	
</template>

<template id="text-typing">
<span id="input"></span>
<span id="cursor"></span>
<style>
#cursor{
	display: inline-block;
	width: 5px;
}
</style>
</template>

<template id="about-card">
<h2 id="title"></h2>
<div id="content"></div>
<style>
	:host{
		display: block;
	    padding: 25px !important;
	    border-radius: 8px;
	    box-shadow: var(--box-shadow-middle);
	}
	h2 {
		padding-bottom: 10px;
	    border-bottom: 1px solid black;
	}
	#content > ul{
		padding-left: 25px;
	}
	#content li{
	    margin-top: 20px;
	}
</style>
</template>
