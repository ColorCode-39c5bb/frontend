
<template id="blog-home">
	<slot name="blog-item"></slot>
	<slot name="pagination">
		<not-slotted>未插入页码栏</not-slotted>
	</slot>

<template id="blog-navigation">
<slot name="profile"></slot>
<slot name="nick"></slot>
<slot name="signature"></slot>
<nav>
	<slot><not-slotted>未插入导航项</not-slotted></slot>
</nav>
<style>
::slotted([slot="profile"]){
	width: 45%;
	aspect-ratio: 1 / 1; /* 高度等于宽度 */
	border: 5px solid white;
	border-radius: 100%;
	transition: all 0.1s ease-in-out;

}
::slotted([slot="profile"]:hover){
	width: 49%;
}
::slotted(a){
	display: block;
}
:host {
	display: block;
    width: 100%;
    height: 100%;
    padding: 20px 5px;
    border-radius: 10px;
	text-align: center;
    
    box-shadow: var(--box_shadow_middle);
}
</style>
