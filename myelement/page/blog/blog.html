
<template id="blog-home">
	<slot name="item"></slot>
	<slot name="pagination">
		<not-slotted>未插入页码栏</not-slotted>
	</slot>
</template>

<template id="blog-navigation">
<div id="profile"></div>
<div id="nick"></div>
<text-typing id="signature" typeinterval="200"></text-typing>
<nav>
	<slot><not-slotted>未插入导航项</not-slotted></slot>
</nav>
<style>
#profile{
	display: inline-block;
	width: 45%;
	aspect-ratio: 1 / 1; /* 高度等于宽度 */
	border: 5px solid white;
	border-radius: 100%;
	transition: all 0.2s ease-in-out;

}
#profile:hover{
	width: 49%;
}
::slotted(a){
	display: block;
}
:host {
	display: block;
    width: 100%;
    height: 100%;
    padding: 20px 5px !important;
    border-radius: 10px;
	text-align: center;
    
    box-shadow: var(--box-shadow-middle);
}
</style>
</template>

<template id="blog-about">
	<slot name="item"></slot>
<style>
	::slotted([slot="item"]){
		margin-bottom: 35px !important;
	}
</style>
</template>
