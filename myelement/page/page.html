<template id="page-article">
<h1 id="title" style="text-align: center;"></h1>
<div id="article-info">
    <span>发布 <span id="create-date"></span></span>
    <span>更新 <span id="update-date"></span></span>
    <span><i class="fas fa-eye"></i> <span id="read"></span></span>
</div>
<!-- 封面图 -->
<img id="cover" style="width: 100%; border-radius: 8px;" alt="文章封面">
<!-- 文章内容 -->
<div id="content"></div>
<!-- 文章标签 -->
<div id="tags">
    <div class="tag"></div>
</div>

<style>
:host {
	display: block;
	padding: 20px !important;
}
:host > *{
	margin-top: 20px;
	margin-bottom: 20px;
}
#article-info {
    display: block;
	padding-bottom: 10px;
    border-bottom: 1px solid black;
    font-size: 75%;
	text-align: center;
}
#article-info > *{
	display: inline-block;
	width: 33%;
}
#article-info ~ *{
	margin-left: 10%;
	margin-right: 10%;
}

.tag {
	display: inline-block;
    border-radius: 20px;
    padding: 8px 15px;
	margin: 0 5px;

    cursor: pointer;
    position: relative;
    box-shadow: var(--box-shadow-small);
	transition: all 0.1s ease-in-out;
}
.tag:hover{
    color: white;
}
.tag:active{
    scale: 0.9;
}

.article-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.like-btn.liked {
    color: #ff4757;
    border-color: #ff4757;
}
</style>
</template>


<template id="page-home">
	<background-image src="http://localhost:5500/resource/u=2757702891,4065448673&fm=253&app=138&f=PNG.png" load-animation="spinner"></background-image>
	<text-typing id="greeting" typeinterval="200"></text-typing>
<style>
#greeting{
	display: block;
	width: 95%;
	margin: 0 auto;
	padding: 50vh 0;
	font-size: xxx-large;
	text-align: center;
}
</style>
</template>


<template id="page-about">
	<slot name="item"></slot>
<style>
	:host{
		display: block;
		padding: 20px 40px !important;
	}
	::slotted([slot="item"]){
		margin-bottom: 20px !important;
	}
</style>
</template>


<template id="page-blog">
<background-image src="http://localhost:5500/resource/1650206891050.png" load-animation="spinner"></background-image>
<section id="board">
	<textarea name="keyword"></textarea>
	<div id="tags">
		<div class="tag">
			<span></span>
			<span class="mark"></span>
		</div>
	</div>
</section>
<section id="main" style="position: relative;">
	<slot name="content"></slot>
	<slot name="navigation"></slot>
</section>
<style>
	#board{
		height: 100vh; width: 100%;
		display: flex;
		flex-wrap: wrap;
		align-content: center;
		justify-content: center;
	}
	[name="keyword"]{
		height: 40px;
		flex-basis: 70%;
		box-shadow: var(--box-shadow-small);
		background-color: rgba(255, 255, 255, 0.75);
		resize: none;
		border-radius: 20px;;
	}
	#tags{
		flex-basis: 50%;
		text-align: center;
		margin-top: 30px;
	}
	.tag {
		display: inline-block;
	    border-radius: 20px;
	    padding: 8px 15px;
		margin: 0 5px;

	    cursor: pointer;
	    position: relative;
	    box-shadow: var(--box-shadow-small);
		transition: all 0.1s ease-in-out;
	}
	.tag:hover{
	    color: white;
		background-color: silver;
	}
	.tag *{
		pointer-events: none;
	}
	.mark{
	    width: 15px;
		aspect-ratio: 1;
	    border: 1px solid black;
	    border-radius: 50%;

	    position: absolute;
	    top: -5px;
	    right: -5px;
	    font-size: 50%;
		transition: all 0.1s ease-in-out;
	}
	.mark:hover{
	    scale: 1.5;
	}
	::slotted([slot="navigation"]){
		display: inline-block;
		position: sticky;
		bottom: 15vh;
		left: 7.5%;
		width: 20%;
		height: 70vh;
	}
	::slotted([slot="content"]){
		display: block;
		margin-right: 7.5% !important;
		margin-left: auto !important;
		width: 60%;
	}

	.selected{
		background-color: silver;
	}
</style>
</template>
