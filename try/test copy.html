<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
<style>
	*{
		box-sizing: border-box;
		margin: 0;
		padding: 0;
		line-height: 1;
		border: none;
	}
	.tag {
	    border-radius: 20px;
	    padding: 5px 13px;

	    cursor: pointer;
	    position: relative;
	    box-shadow: var(--box-shadow-small);
	}
	.tag:hover > *{
	    color: white;
	}
</style>
</head>
<body>
<main>
	<div id="tags">
		<span class="tag">TAG</span>
	</div>
</main>
</body>
</html>
