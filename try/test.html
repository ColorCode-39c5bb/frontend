<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<style>
svg{
	position: fixed;
	top: 0; left: 0;
	width: 100vw; height: 100vh;
	overflow: visible;
}
g{
	fill: none;
	transform-origin: center center;
	width: 100%; height: 100%;
}
circle:not(#edge){
	stroke-dasharray: var(--dasharray);
	stroke-dashoffset: calc(var(--dasharray)/2);
	transform-origin: center center;
}
polygon{
	transform: translate(50%, 231%);
}
</style>
<body>
<svg><g>
	<circle id="edge" cx="50%" cy="50%" r="1500" stroke="black" stroke-width="4"/>
	<g id="hour">
		<g id="hour-markers"></g>
		<circle cx="50%" cy="50%" r="1450" stroke="black" stroke-width="10"/>
	</g>
	<circle id="minute" cx="50%" cy="50%" r="1430" stroke="red" stroke-width="7"/>
	<circle id="second" cx="50%" cy="50%" r="1410" stroke="black" stroke-width="4"/>
	<polygon id="pointer" points="0,0 -50,-86 50,-86" stroke="white" stroke-width="4"/>
</g></svg>
<script>
	const svg = document.querySelector("svg");
	svg.setAttribute("width", window.innerWidth); svg.setAttribute("height", window.innerHeight);
	svg.group = svg.querySelector("g");
	const [edge, hour, minute, second] = svg.group.querySelectorAll("circle");
	const radius = edge.getAttribute("r");
	const cy = -radius - svg.getAttribute("height")/2 + svg.getAttribute("height")/4;
	svg.group.style.transform = `translateY(${cy}px)`;
	second.style.setProperty("--dasharray", Math.PI*second.getAttribute("r")*2/24);
	minute.style.setProperty("--dasharray", Math.PI*minute.getAttribute("r")*2/24);
	hour.style.setProperty("--dasharray", Math.PI*hour.getAttribute("r")*2/24);

	function createEvenlyDistributedText() {
		const markersGroup = document.getElementById('hour-markers');
		const centerX = svg.getAttribute("width")/2;
		const centerY = svg.getAttribute("height")/2;
		const radius = hour.getAttribute("r");
		const texts = ['Ⅻ', 'Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', 'Ⅵ', 'Ⅶ', 'Ⅷ', 'Ⅸ', 'Ⅹ', 'Ⅺ'];
		const total = texts.length;
		markersGroup.innerHTML = ''; // 清空
		texts.forEach((text, index) => {
			// 计算每个文字的角度位置（12点钟方向为起点）
			const angle = (index * 360 / total - 90) * Math.PI / 180;
			
			// 计算坐标
			const x = centerX + radius * Math.cos(angle);
			const y = centerY + radius * Math.sin(angle);
			
			// 创建text元素
			const textElem = document.createElementNS('http://www.w3.org/2000/svg', 'text');
			textElem.setAttribute('x', x);
			textElem.setAttribute('y', y);
			// textElem.setAttribute('text-anchor', 'middle');
			// textElem.setAttribute('dominant-baseline', 'bottom');
			textElem.setAttribute('font-size', '50');
			textElem.setAttribute('fill', "red");
			
			// 调整文字方向使其径向朝外
			textElem.setAttribute('transform', `rotate(${index * 30}, ${x}, ${y})`);
			
			textElem.textContent = text;
			markersGroup.appendChild(textElem);
		});
	}
	createEvenlyDistributedText();

	svg.groupCopy = svg.group.cloneNode(true);
	svg.groupCopy.style.transform = `translateY(${-cy}px) scale(-1)`;
	console.log(svg.groupCopy, svg.group);
	svg.appendChild(svg.groupCopy);

	const interval = 1/60;
	let lastTime = 0;
	window.addEventListener("mousemove", (e)=>{
		if(Date.now()-lastTime < interval) return;
		const angle = Math.atan2(e.clientY - window.innerHeight/2, e.clientX - window.innerWidth/2);
		svg.style.transform = `rotate(${angle}rad)`;
		[svg.group, svg.groupCopy].forEach((g)=>{
			const [edge, hour, minute, second] = g.children;
			hour.style.transform = `rotate(${angle}rad)`;
			minute.style.transform = `rotate(${angle*60}rad)`;
			second.style.transform = `rotate(${angle*3600}rad)`;
		});
		lastTime = Date.now();
	});

</script>
</body>
</html>
